<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#098751"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FAFX"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg"/>
  <link rel="shortcut icon" href="../favicon/favicon.svg"/>
<title>Set New Password – FAFX Trading Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.login-wrap { max-width: 420px; margin: 0 auto; }
.status-msg { font-size: 0.82rem; margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 4px; display: none; }
.status-msg.error { display: block; background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
.status-msg.success { display: block; background: rgba(9,135,81,0.1); color: var(--green-light); border: 1px solid var(--green); }
.gate-msg { text-align: center; padding: 4rem 1rem; }
.reset-form { display: none; }
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="nav-logo">FA<span>FX</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="../index.html">Home</a></li>
    <li><a href="login.html">Student Login</a></li>
  </ul>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</nav>

<div class="page-banner" style="padding-top: 90px;">
  <div class="section-tag">Student Portal</div>
  <h1>Set A <span>New Password</span></h1>
  <p>Choose a new password for your FAFX account.</p>
</div>

<section style="background:var(--black);">
  <div class="login-wrap">

    <div class="gate-msg" id="gateMsg">
      <p class="section-desc" style="margin:0 auto;">Verifying your reset link…</p>
    </div>

    <form id="resetForm" class="reset-form">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-input" required minlength="8" placeholder="At least 8 characters"/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirmPassword" class="form-input" required minlength="8"/>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;" id="resetBtn">Update Password</button>
      <div class="status-msg" id="resetStatus"></div>
    </form>

  </div>
</section>

<footer>
  <div class="footer-logo">FA<span>FX</span></div>
  <p class="footer-copy">© 2026 FAFX Trading Academy. All rights reserved.</p>
</footer>
<div class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/main.js"></script>
<script>
(async function () {
  // Supabase puts the recovery token in the URL hash and fires a
  // PASSWORD_RECOVERY auth event once it's parsed the link. We wait for
  // that (or an existing recovery session) before showing the form.
  const gateMsg = document.getElementById('gateMsg');
  const resetForm = document.getElementById('resetForm');

  function unlockForm() {
    gateMsg.style.display = 'none';
    resetForm.style.display = 'block';
  }

  const { data: { session } } = await fafxDB.auth.getSession();
  if (session) {
    unlockForm();
  } else {
    fafxDB.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') unlockForm();
    });
    // Fallback in case the event already fired before this listener attached
    setTimeout(async () => {
      const { data: { session: s2 } } = await fafxDB.auth.getSession();
      if (s2 && resetForm.style.display === 'none') unlockForm();
      else if (resetForm.style.display === 'none') {
        gateMsg.innerHTML = '<p class="section-desc" style="margin:0 auto;">This reset link is invalid or has expired. <a href="forgot-password.html" style="color:var(--green-light);">Request a new one →</a></p>';
      }
    }, 3000);
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('resetStatus');
    const fd = new FormData(e.target);
    const password = fd.get('password');
    const confirmPassword = fd.get('confirmPassword');

    if (password !== confirmPassword) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = '⚠️ Passwords do not match.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Updating…';
    statusEl.style.display = 'none';

    const { error } = await fafxDB.auth.updateUser({ password });

    btn.disabled = false; btn.textContent = 'Update Password';

    if (error) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = '⚠️ ' + error.message;
      return;
    }

    statusEl.className = 'status-msg success';
    statusEl.textContent = '✅ Password updated! Redirecting to login…';
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  });
})();
</script>
</body>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>

</html>
